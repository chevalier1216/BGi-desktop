name: Codex self-hosted worker

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[CODEX]') || startsWith(github.event.issue.title, '[READY FOR CODEX]'))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Resolve task metadata
        id: meta
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $base = "${{ github.event.repository.default_branch }}"
          if ($env:ISSUE_BODY -match '(?im)^Codex-Base:\s*([A-Za-z0-9._/-]+)\s*$') {
            $base = $Matches[1]
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "branch=codex/issue-${{ github.event.issue.number }}" >> $env:GITHUB_OUTPUT

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.base }}
          fetch-depth: 0

      - name: Prepare Codex work branch
        shell: pwsh
        env:
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git ls-remote --exit-code --heads origin $env:WORK_BRANCH | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin "$($env:WORK_BRANCH):$($env:WORK_BRANCH)"
            git checkout $env:WORK_BRANCH
          } else {
            git checkout -b $env:WORK_BRANCH
          }

      - name: Verify workstation tools
        shell: pwsh
        run: |
          pwsh --version
          gh --version
          node --version
          codex.cmd --version
          cmd.exe /d /s /c "codex.cmd login status 2>&1"

      - name: Run Codex
        shell: pwsh
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $promptPath = Join-Path $env:RUNNER_TEMP "codex-issue-$($env:ISSUE_NUMBER).txt"
          @"
          Work on GitHub issue #$($env:ISSUE_NUMBER) in this repository.

          Title:
          $($env:ISSUE_TITLE)

          Issue body:
          $($env:ISSUE_BODY)

          Instructions:
          - Read AGENTS.md and relevant repository documentation before editing.
          - Follow authoritative BGi specs and existing project decisions.
          - Implement the issue completely on the current work branch.
          - Run focused verification appropriate to the changed area.
          - Preserve existing user work and unrelated dirty state.
          - Do not commit, push, open a pull request, merge, or deploy; the workflow handles Git delivery.
          - Do not invent undecided product requirements.
          - If a genuine product decision is required, avoid speculative implementation and report the blocker.
          "@ | Set-Content -Path $promptPath -Encoding utf8

          Get-Content -Path $promptPath -Raw |
            codex.cmd --ask-for-approval never exec --sandbox workspace-write --cd "$env:GITHUB_WORKSPACE" -

      - name: Detect changes
        id: changes
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Verify repository
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git diff --check

          $changed = git status --porcelain | ForEach-Object { $_.Substring(3) }
          $godotChanged = $changed | Where-Object { $_ -like 'godot/BGiDesktop/*' }

          if ($godotChanged) {
            $godot = 'G:\Projects\Godot\Godot_v4.7.1-stable_win64_console.exe'
            if (-not (Test-Path $godot)) {
              throw "Expected BGi Godot console not found: $godot"
            }

            $testRoot = Join-Path $env:RUNNER_TEMP ("bgi-codex-verify-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
            $oldAppData = $env:APPDATA
            $oldLocalAppData = $env:LOCALAPPDATA
            try {
              $env:APPDATA = $testRoot
              $env:LOCALAPPDATA = $testRoot
              & $godot --headless --path "$env:GITHUB_WORKSPACE\godot\BGiDesktop" --editor --quit --log-file (Join-Path $testRoot 'godot-verify.log')
              if ($LASTEXITCODE -ne 0) {
                throw "Godot headless project verification failed with exit code $LASTEXITCODE"
              }
            } finally {
              $env:APPDATA = $oldAppData
              $env:LOCALAPPDATA = $oldLocalAppData
            }
          }

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "codex-self-hosted"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement issue #$($env:ISSUE_NUMBER) with Codex"
          git push -u origin $env:WORK_BRANCH

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ steps.meta.outputs.base }}
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.WORK_BRANCH}`;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: process.env.BASE_BRANCH,
            });

            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: process.env.WORK_BRANCH,
                base: process.env.BASE_BRANCH,
                title: process.env.ISSUE_TITLE
                  .replace(/^\[CODEX\]\s*/i, '')
                  .replace(/^\[READY FOR CODEX\]\s*/i, ''),
                body: `Automated Codex implementation for #${process.env.ISSUE_NUMBER}.\n\nBase: \`${process.env.BASE_BRANCH}\`\n\nFinal verification ran in the self-hosted workflow.`,
                draft: true,
              });
              pr = created.data;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Codex implementation PR: ${pr.html_url}`,
            });

      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: 'Codex completed without repository changes. Check the workflow log for its final response or blockers.',
            });
